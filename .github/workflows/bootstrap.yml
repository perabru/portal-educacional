name: Publicar Portal Educacional
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portal-educacional-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript, currículo e regras
        run: |
          node --check app.js
          node --check management.js
          node --check notas.js
          node --check curriculo.js
          node --check service-worker.js
          node --check functions/index.js
          python -m json.tool firebase.rules.json > /dev/null
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const data=JSON.parse(fs.readFileSync('curriculo.json','utf8'));
          assert.strictEqual(data.length,9);
          assert.strictEqual(new Set(data.map(x=>x.id)).size,9);
          assert(data.every(x=>x.nome&&Array.isArray(x.semanas)));
          assert(fs.readFileSync('index.html','utf8').includes('id="logout-top-btn"'));
          assert(JSON.parse(fs.readFileSync('firebase.rules.json','utf8')).rules.portalEducacionalV1);
          console.log('Currículo, identidade e regras: OK');
          JS
      - name: Verificar sessão, notas, administração, Gemini e PWA
        run: |
          node tests/testar-curriculo.mjs
          node tests/testar-app.mjs
          node tests/testar-interface.mjs
          node tests/testar-backend.cjs
          node tests/test-pwa.mjs
      - name: Preparar conteúdo público
        run: |
          mkdir -p _site
          cp index.html app.js management.js notas.js curriculo.js curriculo.json styles.css favicon.svg manifest.webmanifest service-worker.js .nojekyll _site/
          cp -r icons materiais _site/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar conteúdo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
